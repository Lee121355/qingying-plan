<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈计划"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-180.png"><title>饮食计划 · 轻盈计划</title><link rel="stylesheet" href="app.css"><style>
.target-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.target-box{padding:16px}.target-box span{color:var(--muted);font-size:9px}.target-box b{display:block;margin-top:7px;font-size:19px}.target-box small{color:var(--green);font-size:8px}.tool-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:15px}.tool-card{padding:20px}.tool-card h2{margin:0 0 5px;font-size:14px}.tool-card>p{margin:0 0 15px;color:var(--muted);font-size:10px;line-height:1.6}.analysis{display:none;margin-top:12px}.analysis.show{display:block}.analysis-card{padding:13px;border:1px solid var(--line);border-radius:7px;background:#fff}.analysis-card h3{margin:0 0 4px;font-size:11px}.analysis-card p{margin:0 0 9px;color:var(--muted);font-size:9px}.loading{display:flex;align-items:center;gap:8px;color:var(--green);font-size:10px}.loading i{width:14px;height:14px;border:2px solid #c8dfcf;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.recipes-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}@media(max-width:900px){.recipes-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.target-strip{grid-template-columns:repeat(2,1fr)}.tool-grid{grid-template-columns:1fr}.recipes-grid{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="redesign.css"></head><body><div class="app-shell"><aside class="sidebar" data-shell></aside><main class="main"><header class="topbar"><div><p class="eyebrow">个性化营养方案</p><h1>饮食计划</h1><p>按照你的身体数据与目标，补足营养，而不是简单少吃</p></div><div class="page-actions"><a class="btn btn-outline" href="profile.html"><i data-lucide="sliders-horizontal"></i>调整身体数据</a><a class="btn btn-primary" href="daily-plan.html"><i data-lucide="calendar-check"></i>完整日计划</a></div></header>
<div class="target-strip"><div class="card target-box"><span>建议每日热量</span><b><i data-target="calories"></i> kcal</b><small>结合活动量与身材目标</small></div><div class="card target-box"><span>建议蛋白质</span><b><i data-target="protein"></i> g</b><small>约每公斤体重 1.55 g</small></div><div class="card target-box"><span>建议碳水</span><b><i data-target="carbs"></i> g</b><small>优先全谷物、薯类与果蔬</small></div><div class="card target-box"><span>建议脂肪</span><b><i data-target="fat"></i> g</b><small>优先坚果、鱼类和橄榄油</small></div></div>
<div class="notice green" id="targetExplain"></div>
<div class="section-head"><div><h2>自定义当前饮食</h2><p>直接告诉系统你准备吃什么，获取营养补充建议</p></div></div>
<div class="tool-grid"><section class="card tool-card"><h2>填写食物与份量</h2><p>写下准备吃的食物和大致份量，系统会补充缺少的营养搭配。</p><div class="form-grid"><div class="field"><label for="customFood">食物与份量</label><textarea class="textarea" id="customFood" placeholder="例如：午餐想吃 200g 牛肉面，不要香菜"></textarea></div><div class="field"><label for="customMeal">餐次</label><select class="select" id="customMeal"><option>早餐</option><option selected>午餐</option><option>晚餐</option><option>加餐</option></select><small>分析结果可确认后加入完整计划</small></div></div><button class="btn btn-primary" id="analyzeCustom" style="margin-top:14px;width:100%"><i data-lucide="wand-sparkles"></i>分析并补充搭配</button><div class="analysis" id="customAnalysis"></div></section></div>
<div class="section-head"><div><h2>今日推荐餐饮</h2><p>点击卡片查看用料和居家制作步骤</p></div><a href="recipes.html">进入食谱库 →</a></div><div class="recipes-grid" id="recommendations"></div></main></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="app.js"></script><script>
initCommon('meal');const t=FOOD_APP.targets();Object.entries(t).forEach(([k,v])=>{const el=document.querySelector(`[data-target="${k}"]`);if(el)el.textContent=t.ready?v:'待完善'});targetExplain.textContent=t.ready?`你今天建议补充约 ${t.carbs} g 碳水和 ${t.protein} g 蛋白质。可把碳水分散到三餐，训练后优先补充 25 至 35 g 蛋白质；蔬菜建议不少于 500 g。`:'请先完善性别、年龄、身高、体重、目标和活动量，系统再为你计算每日营养建议。';
function recipeCard(r){return `<article class="card food-card"><a class="food-image" href="recipe-detail.html?id=${r.id}"><img src="${r.image}" alt="${r.name}"><span class="badge">${r.meal}</span></a><div class="food-body"><h3>${r.name}</h3><p>${r.fit}</p><div class="tag-row" style="margin-top:8px">${r.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="food-meta"><span><b>${r.calories}</b> kcal</span><span>${r.grams} g</span><span>蛋白 ${r.protein} g</span></div><div class="card-actions"><a class="btn btn-outline" href="recipe-detail.html?id=${r.id}">制作步骤</a><button class="btn btn-secondary" data-add="${r.id}">加入计划</button></div></div></article>`}recommendations.innerHTML=FOOD_APP.recipes.slice(0,6).map(recipeCard).join('');document.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{const r=FOOD_APP.recipes.find(x=>x.id===btn.dataset.add);FOOD_APP.addToPlan(r)});
analyzeCustom.onclick=()=>{if(!customFood.value.trim()){FOOD_APP.toast('请先填写食物和大致份量');return}customAnalysis.className='analysis show';customAnalysis.innerHTML='<div class="loading"><i></i>正在分析热量与营养缺口…</div>';setTimeout(()=>{const item={id:`custom-${Date.now()}`,meal:customMeal.value,name:customFood.value.trim().slice(0,18),calories:510,grams:380,protein:28,carbs:62,image:'https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=900&q=80'};window.customItem=item;customAnalysis.innerHTML=`<div class="analysis-card"><h3>建议：保留主食，增加一份蔬菜和优质蛋白</h3><p>估算 ${item.calories} kcal。建议搭配 120 g 绿叶菜，并将含糖饮料替换为无糖茶。</p><button class="btn btn-secondary" id="addCustom">按建议加入计划</button></div>`;addCustom.onclick=()=>FOOD_APP.addToPlan(item)},800)};
</script></body></html>
