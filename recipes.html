<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈计划"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-180.png"><title>食谱库 · 轻盈计划</title><link rel="stylesheet" href="app.css"><style>
.nutrition-board{padding:19px;margin-bottom:18px}.nutrition-board-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.nutrition-board-head h2{margin:0;font-size:15px}.nutrition-board-head p{margin:4px 0 0;color:var(--muted);font-size:9px}.record-count{padding:6px 9px;border-radius:5px;color:var(--green);background:#edf5ef;font-size:9px;font-weight:700}.nutrient-meters{margin-top:17px;display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.nutrient-meter{padding:12px;border-radius:8px;background:#f5f8f5}.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.meter-top span{color:var(--muted);font-size:8px}.meter-top b{font-size:12px}.meter-top small{color:var(--muted);font-size:8px;font-weight:500}.meter-track{height:6px;margin-top:8px;overflow:hidden;border-radius:5px;background:#e1e8e3}.meter-track i{display:block;width:0;height:100%;border-radius:inherit;background:var(--green-2);transition:width .75s cubic-bezier(.2,.75,.2,1)}.meter-track.orange i{background:var(--orange)}.meter-track.blue i{background:var(--blue)}.meter-track.gold i{background:#ba9942}.ingredient-head{margin:26px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}.ingredient-head h2{margin:0;font-size:17px}.ingredient-head p{margin:4px 0 0;color:var(--muted);font-size:9px}.ingredient-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ingredient-search{width:min(280px,100%)}.ingredient-toggle svg{transition:transform .2s ease}.ingredient-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}.ingredient-filters{margin-bottom:10px;display:flex;gap:6px;max-width:100%;overflow-x:auto;scrollbar-width:none}.ingredient-filters::-webkit-scrollbar{display:none}.ingredient-filters button{flex:none;padding:6px 9px;border:1px solid var(--line);border-radius:6px;color:var(--muted);background:#fff;font-size:8px}.ingredient-filters button.active{color:#fff;border-color:var(--green);background:var(--green)}.ingredient-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.ingredient-grid.expanded{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-inline:contain;padding:2px 2px 10px;scrollbar-color:var(--line-strong) transparent}.ingredient-grid.expanded .ingredient-card{flex:0 0 clamp(150px,18vw,210px);scroll-snap-align:start}.ingredient-card{min-height:122px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;transition:.2s}.ingredient-card:hover{border-color:#aac1b0;transform:translateY(-1px)}.ingredient-card.done{border-color:#93bba2;background:#eaf4ed}.ingredient-icon{width:33px;height:33px;border-radius:8px;display:grid;place-items:center;color:var(--green);background:#edf5ef}.ingredient-card.done .ingredient-icon{color:#fff;background:var(--green)}.ingredient-icon svg{width:17px}.ingredient-card h3{margin:9px 0 3px;font-size:10px}.ingredient-card p{margin:0;color:var(--muted);font-size:8px}.ingredient-card .logged{display:block;margin-top:8px;color:var(--green);font-size:8px;font-weight:700}.filter-row{margin:30px 0 14px;padding-top:25px;border-top:1px solid var(--line);display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.filter-row h2{margin:0;font-size:17px}.filter-row p{margin:4px 0 0;color:var(--muted);font-size:9px}.search{width:min(300px,100%);position:relative}.search svg{position:absolute;left:12px;top:12px;width:16px;color:var(--muted)}.search input{padding-left:37px}.library-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.library{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.food-modal-top{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;margin-bottom:17px}.food-modal-icon{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:var(--green);background:var(--mint)}.food-modal-icon svg{width:23px}.food-modal-top h2{margin:0 0 3px;font-size:16px}.food-modal-top p{margin:0;color:var(--muted);font-size:9px}.preview-nutrients{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.preview-nutrients div{padding:10px 7px;border-radius:7px;text-align:center;background:#f4f7f4}.preview-nutrients span{display:block;color:var(--muted);font-size:7px}.preview-nutrients b{display:block;margin-top:4px;font-size:11px}.amount-presets{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.amount-presets button{padding:5px 8px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:#fff;font-size:8px}.amount-presets button:hover{color:var(--green);border-color:#a9bcae}@media(max-width:950px){.library{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.nutrient-meters{grid-template-columns:repeat(2,1fr)}.library{grid-template-columns:1fr}.library-tools,.ingredient-tools,.ingredient-search{width:100%}.ingredient-toggle{margin-left:auto}.search{width:100%}.preview-nutrients{grid-template-columns:repeat(2,1fr)}}
</style><link rel="stylesheet" href="redesign.css"></head><body><div class="app-shell"><aside class="sidebar" data-shell></aside><main class="main"><header class="topbar"><div><p class="eyebrow">食材记录与居家食谱</p><h1>食谱库</h1><p>记录今日常见食品摄入，再选择适合本周安排的日常食谱</p></div><a class="btn btn-primary" href="meal-plan.html"><i data-lucide="utensils"></i>定制饮食</a></header>
<section class="card nutrition-board"><div class="nutrition-board-head"><div><h2>今日食品营养仪表盘</h2><p>登记食品克数后，热量和营养成分会动态累加</p></div><span class="record-count" id="recordCount">已记录 0 项</span></div><div class="nutrient-meters"><div class="nutrient-meter"><div class="meter-top"><span>热量</span><b><i id="logCalories">0</i> <small>kcal</small></b></div><div class="meter-track orange"><i id="calorieMeter"></i></div></div><div class="nutrient-meter"><div class="meter-top"><span>蛋白质</span><b><i id="logProtein">0</i> <small>g</small></b></div><div class="meter-track"><i id="proteinMeter"></i></div></div><div class="nutrient-meter"><div class="meter-top"><span>碳水</span><b><i id="logCarbs">0</i> <small>g</small></b></div><div class="meter-track blue"><i id="carbMeter"></i></div></div><div class="nutrient-meter"><div class="meter-top"><span>脂肪</span><b><i id="logFat">0</i> <small>g</small></b></div><div class="meter-track gold"><i id="fatMeter"></i></div></div></div></section>
<section><div class="ingredient-head"><div><h2>常见减脂食品</h2><p>点击食品卡片，登记本次大约摄入多少克</p></div><div class="ingredient-tools"><div class="search ingredient-search"><i data-lucide="search"></i><input class="input" id="ingredientSearch" placeholder="搜索食品或分类"></div><button class="icon-btn ingredient-toggle" id="ingredientToggle" type="button" aria-expanded="false" aria-controls="ingredientGrid" title="展开更多食品"><i data-lucide="chevron-down"></i></button></div></div><div class="ingredient-filters" id="ingredientFilters"></div><div class="ingredient-grid collapsed" id="ingredientGrid"></div></section>
<section><div class="filter-row"><div><h2>健康食谱推荐</h2><p>查看食品热量、适合人群与制作方法</p></div><div class="library-tools"><div class="search"><i data-lucide="search"></i><input class="input" id="searchInput" placeholder="搜索食谱、目标或适合人群"></div><div class="segmented" id="filters"><button class="active" data-filter="全部">全部</button><button data-filter="早餐">早餐</button><button data-filter="午餐">午餐</button><button data-filter="晚餐">晚餐</button></div><button class="collapse-toggle" id="recipeToggle" type="button" aria-expanded="false"><span>展开更多</span><i data-lucide="chevron-down"></i></button></div></div><div class="library" id="library"></div></section></main></div>
<div class="modal-backdrop" id="foodLogModal"><div class="modal"><div class="modal-head"><span></span><button class="icon-btn" data-close-modal title="关闭"><i data-lucide="x"></i></button></div><div class="food-modal-top"><div class="food-modal-icon" id="modalFoodIcon"></div><div><h2 id="modalFoodName"></h2><p id="modalFoodGroup"></p></div></div><div class="field"><label for="foodGrams">本次摄入量（克）</label><input class="input" id="foodGrams" type="number" min="0" max="2000" step="5" value="100"><div class="amount-presets"><button type="button" data-grams="50">50 g</button><button type="button" data-grams="100">100 g</button><button type="button" data-grams="150">150 g</button><button type="button" data-grams="200">200 g</button></div></div><div class="preview-nutrients"><div><span>热量</span><b><i id="previewFoodCal">0</i> kcal</b></div><div><span>蛋白质</span><b><i id="previewFoodProtein">0</i> g</b></div><div><span>碳水</span><b><i id="previewFoodCarbs">0</i> g</b></div><div><span>脂肪</span><b><i id="previewFoodFat">0</i> g</b></div></div><div class="form-actions"><button class="btn btn-danger" id="clearFoodLog">清除记录</button><button class="btn btn-primary" id="saveFoodLog"><i data-lucide="check"></i>完成记录</button></div></div></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="app.js"></script><script>
initCommon('recipes');let recipeFilter='全部',ingredientFilter='全部',ingredientExpanded=false,activeFood=null,recipeCatalog=FOOD_APP.recipes;const targets=FOOD_APP.targets();function logs(){return FOOD_APP.get('ingredientLogs')}function round(value){return Math.round(value*10)/10}
function renderDashboard(animate=true){const entries=Object.entries(logs()),total=entries.reduce((sum,[id,grams])=>{const food=FOOD_APP.ingredients.find(x=>x.id===id),ratio=Number(grams)/100;if(!food)return sum;sum.calories+=food.kcal*ratio;sum.protein+=food.protein*ratio;sum.carbs+=food.carbs*ratio;sum.fat+=food.fat*ratio;return sum},{calories:0,protein:0,carbs:0,fat:0});recordCount.textContent=`已记录 ${entries.filter(([,g])=>g>0).length} 项`;const values={Calories:round(total.calories),Protein:round(total.protein),Carbs:round(total.carbs),Fat:round(total.fat)};Object.entries(values).forEach(([key,value])=>{const el=document.getElementById(`log${key}`),start=Number(el.textContent)||0;if(!animate){el.textContent=value;return}const began=performance.now();function tick(now){const p=Math.min(1,(now-began)/500);el.textContent=round(start+(value-start)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick);setTimeout(()=>{el.textContent=value},520)});const rate=(value,goal)=>goal?Math.min(100,value/goal*100):0;requestAnimationFrame(()=>{calorieMeter.style.width=`${rate(total.calories,targets.calories)}%`;proteinMeter.style.width=`${rate(total.protein,targets.protein)}%`;carbMeter.style.width=`${rate(total.carbs,targets.carbs)}%`;fatMeter.style.width=`${rate(total.fat,targets.fat)}%`})}
function renderIngredientFilters(){const groups=['全部',...new Set(FOOD_APP.ingredients.map(x=>x.group))];ingredientFilters.innerHTML=groups.map(g=>`<button class="${g===ingredientFilter?'active':''}" data-ingredient-filter="${g}">${g}</button>`).join('');document.querySelectorAll('[data-ingredient-filter]').forEach(b=>b.onclick=()=>{ingredientFilter=b.dataset.ingredientFilter;renderIngredientFilters();renderIngredients()})}
function renderIngredients(){const saved=logs(),query=ingredientSearch.value.trim().toLowerCase(),matches=FOOD_APP.ingredients.filter(x=>(ingredientFilter==='全部'||x.group===ingredientFilter)&&`${x.name}${x.group}`.toLowerCase().includes(query)),items=ingredientExpanded?matches:matches.slice(0,2);ingredientGrid.className=`ingredient-grid ${ingredientExpanded?'expanded':'collapsed'}`;ingredientToggle.setAttribute('aria-expanded',String(ingredientExpanded));ingredientToggle.title=ingredientExpanded?'收起食品':'展开更多食品';ingredientToggle.disabled=matches.length<=2;ingredientGrid.innerHTML=items.map(x=>{const grams=Number(saved[x.id]||0);return `<button class="ingredient-card ${grams?'done':''}" data-food="${x.id}"><span class="ingredient-icon"><i data-lucide="${x.icon}"></i></span><h3>${x.name}</h3><p>${x.kcal} kcal / 100 g</p>${grams?`<span class="logged">已记录 ${grams} g</span>`:'<span class="logged" style="color:var(--muted)">点击登记</span>'}</button>`}).join('')||'<div class="empty">没有找到匹配食品</div>';if(window.lucide)lucide.createIcons();document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>openFood(b.dataset.food))}
function calculatePreview(){if(!activeFood)return;const ratio=(Number(foodGrams.value)||0)/100;previewFoodCal.textContent=round(activeFood.kcal*ratio);previewFoodProtein.textContent=round(activeFood.protein*ratio);previewFoodCarbs.textContent=round(activeFood.carbs*ratio);previewFoodFat.textContent=round(activeFood.fat*ratio)}function openFood(id){activeFood=FOOD_APP.ingredients.find(x=>x.id===id);modalFoodName.textContent=activeFood.name;modalFoodGroup.textContent=`${activeFood.group} · 每 100 g ${activeFood.kcal} kcal`;modalFoodIcon.innerHTML=`<i data-lucide="${activeFood.icon}"></i>`;foodGrams.value=logs()[id]||100;calculatePreview();foodLogModal.classList.add('open');if(window.lucide)lucide.createIcons()}foodGrams.oninput=calculatePreview;document.querySelectorAll('[data-grams]').forEach(b=>b.onclick=()=>{foodGrams.value=b.dataset.grams;calculatePreview()});saveFoodLog.onclick=()=>{const saved=logs(),grams=Math.max(0,Number(foodGrams.value)||0);if(grams)saved[activeFood.id]=grams;else delete saved[activeFood.id];FOOD_APP.set('ingredientLogs',saved);foodLogModal.classList.remove('open');renderDashboard();renderIngredients();FOOD_APP.toast(`${activeFood.name}已记录 ${grams} g`)};clearFoodLog.onclick=()=>{const saved=logs();delete saved[activeFood.id];FOOD_APP.set('ingredientLogs',saved);foodLogModal.classList.remove('open');renderDashboard();renderIngredients();FOOD_APP.toast('该食品记录已清除')};
let recipeExpanded=false,currentRecipeList=[];function recipeDefaultCount(){return window.innerWidth<=720?2:4}function renderRecipes(){const q=searchInput.value.trim().toLowerCase(),list=recipeCatalog.filter(r=>(recipeFilter==='全部'||r.meal===recipeFilter)&&`${r.name}${r.fit}${r.tags.join('')}`.toLowerCase().includes(q));currentRecipeList=list;const visible=recipeExpanded?list:list.slice(0,recipeDefaultCount());library.innerHTML=visible.map(r=>`<article class="card food-card"><a class="food-image" href="recipe-detail.html?id=${r.id}"><img src="${r.image||'app-icon.svg'}" alt="${r.name}"><span class="badge">${r.meal} · ${r.time} 分钟</span></a><div class="food-body"><h3>${r.name}</h3><p>适合：${r.fit}</p><div class="tag-row" style="margin-top:8px">${r.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="food-meta"><span><b>${r.calories}</b> kcal</span><span>${r.grams} g</span><span>蛋白 ${r.protein} g</span></div><div class="card-actions"><a class="btn btn-outline" href="recipe-detail.html?id=${r.id}">查看做法</a><button class="btn btn-secondary" data-add="${r.id}">加入本周</button></div></div></article>`).join('')||'<div class="empty">没有找到匹配食谱</div>';recipeToggle.hidden=list.length<=recipeDefaultCount();recipeToggle.setAttribute('aria-expanded',String(recipeExpanded));recipeToggle.querySelector('span').textContent=recipeExpanded?'收起':'展开更多';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>FOOD_APP.addToPlan(recipeCatalog.find(r=>r.id===b.dataset.add)))}recipeToggle.onclick=()=>{recipeExpanded=!recipeExpanded;renderRecipes()};ingredientSearch.oninput=renderIngredients;ingredientToggle.onclick=()=>{ingredientExpanded=!ingredientExpanded;renderIngredients()};searchInput.oninput=renderRecipes;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{recipeFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderRecipes()});renderDashboard(false);renderIngredientFilters();renderIngredients();renderRecipes();FOOD_APP.getRecipes().then(recipes=>{recipeCatalog=recipes;renderRecipes()});
</script></body></html>
