<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈计划"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-180.png"><title>制作步骤 · 轻盈计划</title><link rel="stylesheet" href="app.css"><style>.recipe-hero{min-height:320px;display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden}.recipe-hero img{width:100%;height:100%;min-height:320px;object-fit:cover}.recipe-info{padding:30px;display:flex;flex-direction:column;justify-content:center}.recipe-info h1{margin:5px 0 9px;font-size:25px}.recipe-info p{margin:0;color:var(--muted);font-size:11px;line-height:1.7}.recipe-stats{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.recipe-stats div{padding:11px;border-radius:7px;background:#f3f7f4}.recipe-stats span{display:block;color:var(--muted);font-size:8px}.recipe-stats b{display:block;margin-top:4px;font-size:12px}.detail-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px;margin-top:16px}.detail-card{padding:20px}.detail-card h2{margin:0 0 15px;font-size:15px}.ingredient{padding:10px 0;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);font-size:10px}.step{padding:0 0 17px;display:grid;grid-template-columns:27px 1fr;gap:10px}.step-num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--green);font-size:10px;font-weight:700}.step p{margin:3px 0 0;color:var(--muted);font-size:10px;line-height:1.7}@media(max-width:800px){.recipe-hero{grid-template-columns:1fr}.recipe-hero img{min-height:210px;max-height:260px}.recipe-info{padding:21px}.detail-grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="redesign.css"></head><body><div class="app-shell"><aside class="sidebar" data-shell></aside><main class="main"><header class="topbar"><div><p class="eyebrow">居家制作教程</p><h1>食谱详情</h1><p>后期可将食材、步骤和营养数据从 SQL 数据库读取</p></div><a class="btn btn-outline" href="recipes.html"><i data-lucide="arrow-left"></i>返回食谱库</a></header><section class="card recipe-hero"><img id="heroImage" alt="食谱参考图"><div class="recipe-info"><p class="eyebrow" id="mealName"></p><h1 id="recipeName"></h1><p id="recipeFit"></p><div class="tag-row" id="recipeTags" style="margin-top:14px"></div><div class="recipe-stats"><div><span>热量</span><b><i id="recipeCalories"></i> kcal</b></div><div><span>总质量</span><b><i id="recipeGrams"></i> g</b></div><div><span>制作时间</span><b><i id="recipeTime"></i> 分钟</b></div></div><div class="page-actions" style="margin-top:18px"><button class="btn btn-primary" id="addRecipe"><i data-lucide="calendar-plus"></i>加入今日计划</button><a class="btn btn-outline" id="biliLink" target="_blank" rel="noopener"><i data-lucide="external-link"></i>B站教程</a></div></div></section><div class="detail-grid"><section class="card detail-card"><h2>食材清单</h2><div id="ingredients"></div><div class="notice green" style="margin-top:16px">盐和食用油建议按每日总量统筹，调味尽量使用香草、胡椒、柠檬等。</div></section><section class="card detail-card"><h2>制作步骤</h2><div id="steps"></div></section></div></main></div><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="app.js"></script><script>
initCommon('recipes');const id=new URLSearchParams(location.search).get('id');let recipe=FOOD_APP.recipes.find(r=>r.id===id)||FOOD_APP.get('plan').find(r=>String(r.id)===id);if(!recipe)recipe=FOOD_APP.recipes[0];recipe={time:20,fit:'适合日常均衡饮食',tags:['均衡搭配'],ingredients:['主食 1 份','优质蛋白 1 份','蔬菜 2 份'],steps:['清洗并准备全部食材。','少油烹饪至食材熟透。','控制盐量，装盘后即可食用。'],...recipe};document.title=`${recipe.name} · 轻盈计划`;heroImage.src=recipe.image;heroImage.alt=recipe.name;mealName.textContent=recipe.meal;recipeName.textContent=recipe.name;recipeFit.textContent=`适合：${recipe.fit}`;recipeTags.innerHTML=recipe.tags.map(x=>`<span class="tag">${x}</span>`).join('');recipeCalories.textContent=recipe.calories;recipeGrams.textContent=recipe.grams;recipeTime.textContent=recipe.time;ingredients.innerHTML=recipe.ingredients.map((x,i)=>{const parts=x.split(/ (?=\d)/);return `<div class="ingredient"><span>${parts[0]}</span><b>${parts.slice(1).join(' ')||'适量'}</b></div>`}).join('');steps.innerHTML=recipe.steps.map((x,i)=>`<div class="step"><span class="step-num">${i+1}</span><p>${x}</p></div>`).join('');biliLink.href=`https://search.bilibili.com/all?keyword=${encodeURIComponent(recipe.name+' 做法')}`;addRecipe.onclick=()=>FOOD_APP.addToPlan(recipe);
</script></body></html>
