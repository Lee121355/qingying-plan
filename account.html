<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈计划"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-180.png"><title>个人信息与账号 · 轻盈计划</title><link rel="stylesheet" href="app.css"><script>if(localStorage.getItem('food.auth')!=='1')location.replace('login.html')</script><style>
.account-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.profile-block+.profile-block{margin-top:22px;padding-top:21px;border-top:1px solid var(--line)}
.profile-block h2{margin:0 0 15px;font-size:14px}
.account-card{padding:21px;position:sticky;top:28px}
.account-user{display:flex;align-items:center;gap:13px;padding-bottom:17px;border-bottom:1px solid var(--line)}
.account-user strong{display:block;font-size:16px}
.account-user .account-role{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.account-user .avatar{width:52px;height:52px;display:grid;place-items:center;border-radius:50%;color:#713a2b;background:var(--orange-soft);border:1px solid #dfc4b8;font-size:18px;font-weight:700}
.account-meta{padding:15px 0;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.account-meta div{display:flex;justify-content:space-between;gap:12px;font-size:11px}
.account-meta span{color:var(--muted)}
.account-actions{padding-top:16px;display:grid;gap:9px}
.account-actions .btn{width:100%}
.account-note{margin:14px 0 0;color:var(--muted);font-size:10px;line-height:1.7}
@media(max-width:900px){.account-layout{grid-template-columns:1fr}.account-card{position:static}}
</style><link rel="stylesheet" href="redesign.css"></head><body><div class="app-shell"><aside class="sidebar" data-shell></aside><main class="main"><header class="topbar"><div><p class="eyebrow">个人中心</p><h1>个人信息与账号</h1><p>管理身体资料与营养目标，也可以切换或退出当前账号</p></div><div class="page-actions"><a class="btn btn-outline" href="index.html"><i data-lucide="arrow-left"></i>返回今日概况</a></div></header>
<div class="notice green" style="margin-bottom:14px">这里的个人资料与开始时的资料填写页面共用同一份数据，保存后两处会同步更新。</div>
<div class="account-layout"><form class="card form-card" id="profileForm"><div class="profile-block"><h2>基本信息</h2><div class="form-grid"><div class="field"><label for="name">昵称</label><input class="input" id="name" required autocomplete="name"></div><div class="field"><label for="gender">性别</label><select class="select" id="gender" required><option value="">请选择</option><option>女</option><option>男</option></select></div><div class="field"><label for="age">年龄</label><input class="input" id="age" type="number" min="14" max="90" required><small>用于估算基础代谢</small></div><div class="field"><label for="height">身高（cm）</label><input class="input" id="height" type="number" min="120" max="230" required></div><div class="field"><label for="weight">体重（kg）</label><input class="input" id="weight" type="number" min="30" max="250" step="0.1" required></div><div class="field"><label for="bodyFat">体脂率（选填）</label><input class="input" id="bodyFat" type="number" min="3" max="60" step="0.1"><small>建议使用体脂秤或专业设备测量</small></div></div></div>
<div class="profile-block"><h2>目标与活动量</h2><div class="form-grid"><div class="field"><label for="goal">目标身材</label><select class="select" id="goal" required><option value="">请选择</option><option>减脂</option><option>紧致塑形</option><option>增肌</option><option>维持健康</option></select></div><div class="field"><label for="activity">日常活动量</label><select class="select" id="activity" required><option value="">请选择</option><option>低活动</option><option>中等活动</option><option>高强度活动</option></select></div></div></div>
<div class="form-actions"><button class="btn btn-primary" type="submit"><i data-lucide="save"></i>保存并更新建议</button></div></form>
<aside class="card account-card"><div class="account-user"><span class="avatar" data-user-avatar>用</span><div><strong data-user-name>用户</strong><span class="account-role">轻盈计划用户</span></div></div><div class="account-meta"><div><span>当前账号</span><b id="accountName">-</b></div><div><span>登录状态</span><b>已登录</b></div><div><span>健康数据</span><b>保存在本机</b></div></div><div class="account-actions"><a class="btn btn-outline" href="login.html?switch=1"><i data-lucide="repeat"></i>切换账号</a><button class="btn btn-danger" id="logoutButton" type="button"><i data-lucide="log-out"></i>退出登录</button></div><p class="account-note">退出登录只会结束当前登录状态，你的饮食、饮水与运动记录仍保存在本机，重新登录同一账号即可继续查看。</p></aside></div></main></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="auth.js"></script><script src="app.js"></script>
<script>
initCommon('profile');
const user = FOOD_APP.userId();
const onboardingKey = FOOD_APP.userKey('onboardingComplete', user);
const form = document.getElementById('profileForm');
document.getElementById('accountName').textContent = user;
const fields = {
  name: document.getElementById('name'),
  gender: document.getElementById('gender'),
  age: document.getElementById('age'),
  height: document.getElementById('height'),
  weight: document.getElementById('weight'),
  bodyFat: document.getElementById('bodyFat'),
  goal: document.getElementById('goal'),
  activity: document.getElementById('activity')
};
const saved = FOOD_APP.get('profile');
Object.entries(saved).forEach(([key, value]) => { if (fields[key]) fields[key].value = value ?? ''; });
function values() {
  return {
    name: fields.name.value.trim(),
    gender: fields.gender.value,
    age: fields.age.value ? Number(fields.age.value) : '',
    height: fields.height.value ? Number(fields.height.value) : '',
    weight: fields.weight.value ? Number(fields.weight.value) : '',
    bodyFat: fields.bodyFat.value ? Number(fields.bodyFat.value) : '',
    goal: fields.goal.value,
    activity: fields.activity.value
  };
}
function refreshIdentity(name) {
  const display = name || '用户';
  document.querySelectorAll('[data-user-name]').forEach(el => el.textContent = display);
  document.querySelectorAll('[data-user-avatar]').forEach(el => el.textContent = display.slice(0, 1));
}
form.onsubmit = event => {
  event.preventDefault();
  const profile = values();
  FOOD_APP.set('profile', profile);
  if (localStorage.getItem(onboardingKey) === '1') localStorage.setItem(onboardingKey, '2');
  refreshIdentity(profile.name);
  FOOD_APP.toast('个人资料已保存，营养建议已同步更新');
};
document.getElementById('logoutButton').onclick = () => {
  if (!window.confirm('确定要退出登录吗？退出后需要重新登录才能查看健康数据。')) return;
  const current = FOOD_APP.userId();
  try { FOOD_AUTH.accounts(); } catch {}
  localStorage.removeItem('food.auth');
  localStorage.removeItem('food.account');
  localStorage.removeItem('food.currentUser');
  try { sessionStorage.removeItem('food.reminderShown.' + encodeURIComponent(current)); } catch {}
  location.replace('login.html');
};
</script></body></html>
