<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#356c50"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈计划"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-180.png"><title>个人资料 · 轻盈计划</title><link rel="stylesheet" href="app.css"><style>
.profile-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.preview-card{padding:21px;position:sticky;top:28px}.preview-card h2{margin:0 0 16px;font-size:15px}.target-row{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}.target-row:last-child{border:0}.target-row span{color:var(--muted);font-size:10px}.target-row b{font-size:15px}.profile-block+.profile-block{margin-top:22px;padding-top:21px;border-top:1px solid var(--line)}.profile-block h2{margin:0 0 15px;font-size:14px}@media(max-width:900px){.profile-layout{grid-template-columns:1fr}.preview-card{position:static}}
</style></head><body><div class="app-shell"><aside class="sidebar" data-shell></aside><main class="main"><header class="topbar"><div><p class="eyebrow">个人中心</p><h1>编辑个人资料</h1><p>系统会根据你的身体数据与目标重新计算饮食建议</p></div><a class="btn btn-outline" href="index.html"><i data-lucide="arrow-left"></i>返回首页</a></header>
<div class="profile-layout"><form class="card form-card" id="profileForm"><div class="profile-block"><h2>基本信息</h2><div class="form-grid"><div class="field"><label for="name">昵称</label><input class="input" id="name" required></div><div class="field"><label for="gender">性别</label><select class="select" id="gender"><option>女</option><option>男</option></select></div><div class="field"><label for="age">年龄</label><input class="input" id="age" type="number" min="14" max="90" required><small>用于估算基础代谢</small></div><div class="field"><label for="height">身高（cm）</label><input class="input" id="height" type="number" min="120" max="230" required></div><div class="field"><label for="weight">体重（kg）</label><input class="input" id="weight" type="number" min="30" max="250" step="0.1" required></div><div class="field"><label for="bodyFat">体脂率（选填）</label><input class="input" id="bodyFat" type="number" min="3" max="60" step="0.1"><small>建议使用体脂秤或专业设备测量</small></div></div></div>
<div class="profile-block"><h2>目标与活动量</h2><div class="form-grid"><div class="field"><label for="goal">目标身材</label><select class="select" id="goal"><option>减脂</option><option>紧致塑形</option><option>增肌</option><option>维持健康</option></select></div><div class="field"><label for="activity">日常活动量</label><select class="select" id="activity"><option>低活动</option><option>中等活动</option><option>高强度活动</option></select></div></div></div>
<div class="profile-block"><div class="switch-row"><div><strong>保存后前往饮食计划</strong><span>直接查看基于新数据生成的碳水与蛋白质建议</span></div><label class="switch"><input id="redirectMeal" type="checkbox" checked><i></i></label></div></div><div class="form-actions"><a class="btn btn-outline" href="index.html">取消</a><button class="btn btn-primary" type="submit"><i data-lucide="save"></i>保存并更新建议</button></div></form>
<aside class="card preview-card"><p class="eyebrow">实时预览</p><h2>每日营养建议</h2><div class="target-row"><span>BMI</span><b id="previewBmi">21.3</b></div><div class="target-row"><span>每日热量</span><b><i id="previewCalories">1760</i> kcal</b></div><div class="target-row"><span>蛋白质</span><b><i id="previewProtein">97</i> g</b></div><div class="target-row"><span>碳水</span><b><i id="previewCarbs">202</i> g</b></div><div class="target-row"><span>脂肪</span><b><i id="previewFat">53</i> g</b></div><div class="notice green" style="margin-top:16px">这些结果是日常健康管理参考，不替代医生或注册营养师的诊疗建议。</div></aside></div></main></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="app.js"></script><script>
initCommon('profile');const form=document.getElementById('profileForm');const fields={name:document.getElementById('name'),gender:document.getElementById('gender'),age:document.getElementById('age'),height:document.getElementById('height'),weight:document.getElementById('weight'),bodyFat:document.getElementById('bodyFat'),goal:document.getElementById('goal'),activity:document.getElementById('activity')};const saved=FOOD_APP.get('profile');Object.entries(saved).forEach(([key,value])=>{if(fields[key])fields[key].value=value??''});function values(){return{name:fields.name.value.trim()||'用户',gender:fields.gender.value,age:Number(fields.age.value)||28,height:Number(fields.height.value)||170,weight:Number(fields.weight.value)||60,bodyFat:fields.bodyFat.value?Number(fields.bodyFat.value):'',goal:fields.goal.value,activity:fields.activity.value}}function refresh(){const t=FOOD_APP.targets(values());document.getElementById('previewBmi').textContent=t.bmi;document.getElementById('previewCalories').textContent=t.calories;document.getElementById('previewProtein').textContent=t.protein;document.getElementById('previewCarbs').textContent=t.carbs;document.getElementById('previewFat').textContent=t.fat}form.addEventListener('input',refresh);form.onsubmit=e=>{e.preventDefault();FOOD_APP.set('profile',values());FOOD_APP.toast('个人资料与营养建议已更新');setTimeout(()=>location.href=document.getElementById('redirectMeal').checked?'meal-plan.html':'index.html',450)};refresh();
</script></body></html>
