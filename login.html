<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164532"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="轻盈计划"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-180.png"><title>登录 · 轻盈计划</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>
:root{--green:#315f48;--green-deep:#214735;--line:rgba(255,255,255,.28);--ink:#15231b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Noto Sans SC",sans-serif;color:#fff}.login-scene{position:relative;width:100%;height:100%;background:#243d31;isolation:isolate}.scene-photo{position:absolute;inset:-3%;z-index:-3;background-image:url('https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=2200&q=88');background-size:cover;background-position:center;transition:transform 1s cubic-bezier(.2,.75,.2,1),filter 1s ease}.login-scene:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(15,37,26,.72),rgba(17,36,27,.22) 56%,rgba(12,26,19,.45))}.login-scene.open .scene-photo{transform:translateX(-7%) scale(1.09);filter:blur(3px) saturate(.85)}.login-scene.open:before{background:linear-gradient(90deg,rgba(15,37,26,.78),rgba(17,36,27,.45) 56%,rgba(11,23,17,.72))}.login-brand{position:absolute;left:clamp(22px,4vw,62px);top:clamp(22px,5vh,50px);display:flex;align-items:center;gap:11px}.brand-mark{width:39px;height:39px;display:grid;place-items:center;border-radius:11px 11px 11px 3px;background:rgba(255,255,255,.94);color:var(--green);font-weight:800}.login-brand strong{display:block;font-size:16px}.login-brand small{display:block;margin-top:2px;color:rgba(255,255,255,.68);font-size:8px;letter-spacing:.12em}.welcome{position:absolute;left:clamp(22px,7vw,110px);top:50%;width:min(560px,76vw);transform:translateY(-52%);transition:opacity .65s ease,transform .9s cubic-bezier(.2,.75,.2,1)}.login-scene.open .welcome{opacity:.34;transform:translate(-8%,-52%) scale(.96)}.welcome p{margin:0 0 10px;color:#d4e5da;font-size:11px;letter-spacing:.12em}.welcome h1{max-width:510px;margin:0;font-size:clamp(40px,5.5vw,76px);line-height:1.08;letter-spacing:0}.welcome span{display:block;max-width:440px;margin-top:18px;color:rgba(255,255,255,.75);font-size:13px;line-height:1.8}.swipe-wrap{position:absolute;left:clamp(22px,7vw,110px);bottom:clamp(28px,7vh,65px);width:min(390px,calc(100vw - 44px));transition:opacity .35s ease,transform .6s ease}.login-scene.open .swipe-wrap{opacity:0;pointer-events:none;transform:translateX(50px)}.swipe-tip{margin:0 0 10px;color:rgba(255,255,255,.76);font-size:9px;text-align:center;letter-spacing:.08em;animation:tipPulse 2s ease infinite}@keyframes tipPulse{50%{opacity:.5}}.swipe-track{height:58px;padding:6px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.11);backdrop-filter:blur(12px);touch-action:none;user-select:none}.swipe-progress{position:absolute;height:44px;width:44px;border-radius:24px;background:rgba(255,255,255,.16);pointer-events:none}.swipe-handle{position:relative;z-index:1;width:44px;height:44px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;color:var(--green);background:#fff;box-shadow:0 7px 22px rgba(0,0,0,.22);cursor:grab;touch-action:none}.swipe-handle svg{width:19px}.swipe-label{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.88);font-size:10px;pointer-events:none}.auth-sheet{position:absolute;right:0;top:0;width:min(455px,100%);height:100%;padding:clamp(74px,12vh,120px) clamp(28px,4vw,54px) 40px;display:flex;flex-direction:column;justify-content:center;background:rgba(244,248,245,.95);color:var(--ink);box-shadow:-25px 0 70px rgba(8,25,16,.2);backdrop-filter:blur(20px);transform:translateX(105%);transition:transform .9s cubic-bezier(.2,.75,.2,1)}.login-scene.open .auth-sheet{transform:none}.back-button{position:absolute;top:26px;left:26px;width:36px;height:36px;border:1px solid #d9e3dc;border-radius:7px;background:#fff;color:#53675b;display:grid;place-items:center;cursor:pointer}.back-button svg{width:16px}.auth-sheet .eyebrow{margin:0 0 7px;color:var(--green);font-size:10px;font-weight:700;letter-spacing:.1em}.auth-sheet h2{margin:0;font-size:28px}.auth-sheet>p{margin:8px 0 24px;color:#738078;font-size:11px;line-height:1.7}.auth-tabs{margin-bottom:20px;padding:3px;display:grid;grid-template-columns:1fr 1fr;border-radius:8px;background:#e7ede8}.auth-tabs button{height:34px;border:0;border-radius:6px;color:#718078;background:transparent;font-size:10px;font-weight:700;cursor:pointer}.auth-tabs button.active{color:var(--green);background:#fff;box-shadow:0 2px 8px rgba(25,55,37,.08)}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:10px;font-weight:700}.field input{height:44px;padding:0 13px;border:1px solid #d9e3dc;border-radius:7px;outline:none;background:#fff;font:inherit;font-size:11px}.field input:focus{border-color:#528067;box-shadow:0 0 0 3px rgba(66,113,91,.1)}.register-only{display:none}.auth-sheet.register .register-only{display:grid}.auth-row{margin:3px 0 18px;display:flex;justify-content:space-between;gap:12px;color:#748078;font-size:9px}.auth-row a{color:var(--green);text-decoration:none}.submit{height:44px;border:0;border-radius:7px;color:#fff;background:var(--green);font:inherit;font-size:11px;font-weight:700;cursor:pointer}.submit:hover{background:var(--green-deep)}.auth-note{margin-top:15px!important;text-align:center!important;font-size:9px!important}.message{min-height:17px;margin:8px 0 0!important;color:#a7534e!important;font-size:9px!important}.skip{position:absolute;right:28px;bottom:22px;color:#617168;font-size:9px;text-decoration:none}@media(max-width:700px){.welcome{top:43%;width:calc(100vw - 44px)}.welcome h1{font-size:42px}.welcome span{font-size:11px}.auth-sheet{width:100%;padding-top:76px}.login-scene.open .welcome{opacity:0}.swipe-wrap{bottom:36px}}
</style><style id="mobile-safe-area">html,body,.login-scene{min-height:100dvh}.login-brand{top:max(clamp(22px,5vh,50px),calc(env(safe-area-inset-top) + 14px))}.auth-sheet{padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 24px))}.back-button{top:max(26px,calc(env(safe-area-inset-top) + 12px));left:max(26px,calc(env(safe-area-inset-left) + 16px))}.skip{right:max(28px,calc(env(safe-area-inset-right) + 18px));bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px))}@media(max-width:700px){.field input{font-size:16px}.swipe-wrap{bottom:max(36px,calc(env(safe-area-inset-bottom) + 22px))}}</style><link rel="stylesheet" href="login-redesign.css"></head><body><main class="login-scene" id="scene"><div class="scene-photo"></div><div class="login-brand"><span class="brand-mark">轻</span><span><strong>轻盈计划</strong><small>每日健康管理</small></span></div><section class="welcome"><p>饮食 · 运动 · 每日平衡</p><h1>让健康，成为日常的节奏。</h1><span>记录每一餐，也记录身体给你的回应。无需追赶，循序向前。</span></section><div class="swipe-wrap"><p class="swipe-tip">向右滑动进入登录</p><div class="swipe-track" id="swipeTrack"><span class="swipe-progress" id="swipeProgress"></span><span class="swipe-label">滑动开启</span><button class="swipe-handle" id="swipeHandle" aria-label="向右滑动进入登录"><i data-lucide="chevrons-right"></i></button></div></div><section class="auth-sheet" id="authSheet"><button class="back-button" id="backButton" aria-label="返回欢迎页"><i data-lucide="arrow-left"></i></button><p class="eyebrow">欢迎回来</p><h2 id="authTitle">登录轻盈计划</h2><p id="authSubtitle">继续查看你的饮食、饮水与训练记录。</p><div class="auth-tabs"><button class="active" data-mode="login">登录</button><button data-mode="register">注册</button></div><form id="authForm"><div class="field register-only"><label for="displayName">昵称</label><input id="displayName" autocomplete="name" placeholder="怎么称呼你"></div><div class="field"><label for="username">用户名</label><input id="username" autocomplete="username" placeholder="请输入用户名" required></div><div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" minlength="4" required></div><div class="auth-row"><label><input type="checkbox" checked> 保持登录</label><a href="#" id="forgot">忘记密码</a></div><button class="submit" id="submitButton" type="submit">登录</button><p class="message" id="formMessage"></p></form><p class="auth-note">账号信息仅保存在当前浏览器，用于界面演示。</p><a class="skip" href="index.html" id="skipLogin">暂时跳过 →</a></section></main><script src="auth.js"></script><script>
if(localStorage.getItem('food.auth')==='1'&&new URLSearchParams(location.search).get('switch')!=='1')location.replace('index.html');if(window.lucide)lucide.createIcons();const scene=document.getElementById('scene'),track=document.getElementById('swipeTrack'),handle=document.getElementById('swipeHandle'),progress=document.getElementById('swipeProgress'),sheet=document.getElementById('authSheet'),backButton=document.getElementById('backButton'),authForm=document.getElementById('authForm'),authTitle=document.getElementById('authTitle'),authSubtitle=document.getElementById('authSubtitle'),submitButton=document.getElementById('submitButton'),passwordInput=document.getElementById('password'),formMessage=document.getElementById('formMessage'),forgot=document.getElementById('forgot'),displayName=document.getElementById('displayName'),usernameInput=document.getElementById('username'),skipLogin=document.getElementById('skipLogin');let dragging=false,startX=0,startLeft=0,current=0;function maxSlide(){return track.clientWidth-handle.offsetWidth-12}function setSlide(value){current=Math.max(0,Math.min(maxSlide(),value));handle.style.transform=`translateX(${current}px)`;progress.style.width=`${current+44}px`}function openAuth(){setSlide(maxSlide());setTimeout(()=>scene.classList.add('open'),90)}function resetSlide(){dragging=false;handle.style.transition='transform .3s';progress.style.transition='width .3s';setSlide(0);setTimeout(()=>{handle.style.transition='';progress.style.transition=''},320)}handle.addEventListener('pointerdown',e=>{dragging=true;startX=e.clientX;startLeft=current;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!dragging)return;setSlide(startLeft+e.clientX-startX);if(current>maxSlide()*.82){dragging=false;openAuth()}e.preventDefault()});handle.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;if(current>maxSlide()*.72)openAuth();else resetSlide()});handle.addEventListener('pointercancel',resetSlide);handle.onclick=()=>{if(!dragging&&current===0)openAuth()};backButton.onclick=()=>{scene.classList.remove('open');setTimeout(()=>setSlide(0),450)};document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{const register=button.dataset.mode==='register';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===button));sheet.classList.toggle('register',register);authTitle.textContent=register?'创建新账号':'登录轻盈计划';authSubtitle.textContent=register?'注册后开始你的第一份健康计划。':'继续查看你的饮食、饮水与训练记录。';submitButton.textContent=register?'注册并进入':'登录';passwordInput.autocomplete=register?'new-password':'current-password';formMessage.textContent=''});forgot.onclick=e=>{e.preventDefault();formMessage.textContent='演示版本暂不发送找回邮件，请直接注册新账号。'};authForm.onsubmit=e=>{e.preventDefault();const registering=sheet.classList.contains('register'),username=usernameInput.value.trim(),name=displayName.value.trim()||username,result=registering?FOOD_AUTH.register(username,passwordInput.value,name):FOOD_AUTH.login(username,passwordInput.value);if(!result.ok){formMessage.textContent=result.message;return}formMessage.style.color='#205f46';formMessage.textContent=registering?'注册成功，正在进入…':'登录成功，正在进入…';setTimeout(()=>location.href='index.html',450)};skipLogin.onclick=()=>FOOD_AUTH.guest();window.addEventListener('resize',()=>setSlide(scene.classList.contains('open')?maxSlide():0));
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
