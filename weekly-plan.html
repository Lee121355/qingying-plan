<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="轻盈计划"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app-icon-180.png"><title>本周饮食计划 · 轻盈计划</title><link rel="stylesheet" href="app.css"><style>
.plan-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}.day-summary{padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.day-summary span{color:var(--muted);font-size:9px}.day-summary b{display:block;margin-top:6px;font-size:17px}.day-summary small{font-size:8px;color:var(--green)}.plan-list{overflow:hidden}.plan-item{padding:14px;display:grid;grid-template-columns:76px 1fr auto;gap:13px;align-items:center;border-bottom:1px solid var(--line)}.plan-item:last-child{border:0}.plan-item img{width:76px;height:65px;object-fit:cover;border-radius:7px}.plan-item h3{margin:0 0 4px;font-size:12px}.plan-item p{margin:0;color:var(--muted);font-size:9px}.plan-item .numbers{margin-top:7px;display:flex;gap:11px;font-size:9px}.plan-item .actions{display:flex;gap:5px}.adjust-card{padding:18px;position:sticky;top:28px}.adjust-card h2{margin:0 0 5px;font-size:14px}.adjust-card>p{margin:0 0 14px;color:var(--muted);font-size:10px;line-height:1.6}.adjust-result{display:none;margin-top:13px}.adjust-result.show{display:block}.approval{padding:13px;border-radius:7px;background:#fff8eb;border:1px solid #efddb9}.approval h3{margin:0 0 6px;font-size:11px}.approval p{margin:0;color:#725d38;font-size:9px;line-height:1.65}.approval .page-actions{margin-top:10px}.meal-divider{padding:8px 14px;color:var(--green);background:#f0f6f2;font-size:10px;font-weight:700}@media(max-width:950px){.plan-layout{grid-template-columns:1fr}.adjust-card{position:static}}@media(max-width:720px){.day-summary{grid-template-columns:repeat(2,1fr)}.plan-item{grid-template-columns:61px 1fr}.plan-item img{width:61px;height:57px}.plan-item>.actions{grid-column:2;justify-content:flex-start}}
.week-tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:14px;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}.week-tab{min-height:62px;padding:8px 6px;border:0;border-left:1px solid var(--line);background:#fff;color:var(--muted);font-size:10px}.week-tab:first-child{border-left:0}.week-tab strong,.week-tab span{display:block}.week-tab strong{margin-top:4px;color:var(--ink);font-size:12px}.week-tab.active{color:#fff;background:var(--green-deep)}.week-tab.active strong{color:#fff}.week-tab.today:not(.active){box-shadow:inset 0 3px 0 var(--orange)}@media(max-width:720px){.week-tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.week-tab{min-width:82px;scroll-snap-align:start}.week-tab:first-child{border-left:0}}
</style><link rel="stylesheet" href="redesign.css"></head><body><div class="app-shell"><aside class="sidebar" data-shell></aside><main class="main"><header class="topbar"><div><p class="eyebrow" id="planDate"></p><h1>本周饮食计划</h1><p>一次安排七天餐饮，临时调整只影响所选日期</p></div><div class="page-actions"><a class="btn btn-outline" href="recipes.html"><i data-lucide="plus"></i>添加餐饮</a><button class="btn btn-secondary" data-ai-open><i data-lucide="sparkles"></i>询问助手</button></div></header>
<div class="week-tabs" id="weekTabs" aria-label="选择计划日期"></div>
<div class="card day-summary"><div><span>计划总热量</span><b><i id="sumCalories">0</i> kcal</b><small id="calState">计算中</small></div><div><span>蛋白质</span><b><i id="sumProtein">0</i> g</b><small id="proteinState"></small></div><div><span>碳水</span><b><i id="sumCarbs">0</i> g</b><small id="carbState"></small></div><div><span>计划餐数</span><b><i id="mealCount">0</i> 餐</b><small>可随时增删</small></div></div>
<div class="plan-layout"><section><div class="section-head"><div><h2>计划明细</h2><p>点击餐饮可查看完整制作步骤</p></div></div><div class="card plan-list" id="planList"></div></section>
<aside><div class="section-head"><h2>临时饮食微调</h2></div><div class="card adjust-card"><h2>临时想吃别的？</h2><p>添加临时食物后，AI 会先给出平衡建议。只有你明确同意后，才会修改今日计划。</p><div class="field"><label for="tempFood">临时食物</label><input class="input" id="tempFood" placeholder="例如：下午想吃一块芝士蛋糕"></div><div class="field" style="margin-top:10px"><label for="tempCalories">预估热量（kcal）</label><input class="input" id="tempCalories" type="number" value="320"></div><button class="btn btn-primary" id="askAdjust" style="width:100%;margin-top:13px"><i data-lucide="scan-search"></i>生成微调建议</button><div class="adjust-result" id="adjustResult"></div></div><div class="notice green" style="margin-top:13px"><strong>计划原则</strong><br>不过度削减主食，不用保健品替代正餐；优先确保蛋白质、蔬菜、饮水和总能量充足。</div></aside></div></main></div>
<div class="modal-backdrop" id="confirmModal"><div class="modal"><div class="modal-head"><h2>确认调整所选日期计划</h2><button class="icon-btn" data-close-modal><i data-lucide="x"></i></button></div><p style="color:var(--muted);font-size:11px;line-height:1.8">将临时食物加入所选日期的下午加餐，同时把该日晚餐主食减少约 50 g，并增加一份绿叶菜。是否同意应用这次调整？</p><div class="notice">这是一次单日建议，不会在你确认前更改任何餐饮。</div><div class="form-actions"><button class="btn btn-outline" data-close-modal>暂不调整</button><button class="btn btn-primary" id="approveAdjust">同意并应用</button></div></div></div>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="app.js"></script><script>
initCommon('meal');const dayNames=['周一','周二','周三','周四','周五','周六','周日'],weekDates=FOOD_APP.weekDates(),todayKey=FOOD_APP.dateKey();let selectedDate=weekDates.includes(todayKey)?todayKey:weekDates[0],pending=null;document.querySelector('.topbar h1').textContent='本周饮食计划';document.querySelector('.topbar p').textContent='一次安排七天餐饮，临时调整只影响所选日期';
function dateFromKey(key){return new Date(`${key}T00:00:00`)}
function renderTabs(){weekTabs.innerHTML=weekDates.map((key,index)=>{const date=dateFromKey(key);return `<button class="week-tab ${key===selectedDate?'active':''} ${key===todayKey?'today':''}" data-day="${key}" aria-pressed="${key===selectedDate}"><span>${dayNames[index]}${key===todayKey?' · 今天':''}</span><strong>${date.getMonth()+1}/${date.getDate()}</strong></button>`}).join('');document.querySelectorAll('[data-day]').forEach(button=>button.onclick=()=>{selectedDate=button.dataset.day;renderTabs();render()})}
function render(){const plan=FOOD_APP.planForDate(selectedDate),profile=FOOD_APP.get('profile'),targets=FOOD_APP.targets(profile),selected=dateFromKey(selectedDate);planDate.textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(selected).replace('星期',' · 星期');const sums=plan.reduce((a,x)=>({cal:a.cal+Number(x.calories||0),protein:a.protein+Number(x.protein||0),carbs:a.carbs+Number(x.carbs||0)}),{cal:0,protein:0,carbs:0});sumCalories.textContent=sums.cal;sumProtein.textContent=sums.protein;sumCarbs.textContent=sums.carbs;mealCount.textContent=plan.length;calState.textContent=targets.ready?(sums.cal>targets.calories?'略高于目标':`目标 ${targets.calories} kcal`):'完善资料后生成目标';proteinState.textContent=targets.ready?`目标 ${targets.protein} g`:'完善资料后生成目标';carbState.textContent=targets.ready?`目标 ${targets.carbs} g`:'完善资料后生成目标';if(!plan.length){planList.innerHTML='<div class="empty">所选日期还没有餐饮计划，可从食谱库一次加入本周，或使用右下角 AI 助手咨询。</div>';return}const order=['早餐','上午加餐','午餐','下午加餐','晚餐','加餐'];const groups={};plan.forEach(x=>(groups[x.meal]??=[]).push(x));planList.innerHTML=order.filter(k=>groups[k]).map(meal=>`<div class="meal-divider">${meal}</div>${groups[meal].map(x=>`<div class="plan-item"><img src="${x.image||'app-icon.svg'}" alt="${x.name}"><div><h3>${x.name}</h3><p>${x.grams||'--'} g · ${profile.goal?`适合当前 ${profile.goal} 目标`:'尚未设置身材目标'}</p><div class="numbers"><span>${x.calories} kcal</span><span>蛋白 ${x.protein||'--'} g</span><span>碳水 ${x.carbs||'--'} g</span></div></div><div class="actions"><a class="icon-btn" href="recipe-detail.html?id=${encodeURIComponent(x.id)}" title="查看步骤"><i data-lucide="chef-hat"></i></a><button class="icon-btn" data-remove="${x.id}" title="从这一天移除"><i data-lucide="trash-2"></i></button></div></div>`).join('')}`).join('');if(window.lucide)lucide.createIcons();document.querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{FOOD_APP.removePlanDate(button.dataset.remove,selectedDate);render();FOOD_APP.toast('已从所选日期移除')})}renderTabs();render();
askAdjust.onclick=()=>{if(!tempFood.value.trim()){FOOD_APP.toast('请填写临时想吃的食物');return}pending={id:`temp-${Date.now()}`,meal:'下午加餐',name:tempFood.value.trim(),calories:Number(tempCalories.value)||300,grams:120,protein:6,carbs:38,image:'app-icon.svg'};adjustResult.className='adjust-result show';adjustResult.innerHTML=`<div class="approval"><h3>建议可加入，但需要微调晚餐</h3><p>加入约 ${pending.calories} kcal 后，建议所选日期的晚餐主食减少 50 g，额外补充一份蔬菜，蛋白质不减少。</p><div class="page-actions"><button class="btn btn-outline" id="reject">不调整</button><button class="btn btn-secondary" id="review">查看并确认</button></div></div>`;reject.onclick=()=>{pending=null;adjustResult.className='adjust-result';FOOD_APP.toast('计划保持不变')};review.onclick=()=>confirmModal.classList.add('open')};
approveAdjust.onclick=()=>{if(!pending)return;FOOD_APP.addToPlan(pending,{date:selectedDate});const plan=FOOD_APP.get('plan'),dinner=plan.find(x=>x.meal==='晚餐'&&(x.planDates||[]).includes(selectedDate));if(dinner){dinner.planDates=(dinner.planDates||[]).filter(date=>date!==selectedDate);const adjusted={...dinner,id:`${dinner.id}-adjusted-${selectedDate}`,name:dinner.name.includes('已减主食')?dinner.name:`${dinner.name}（已减主食）`,carbs:Math.max(0,(dinner.carbs||0)-12),grams:Math.max(0,(dinner.grams||0)-50),planDates:[selectedDate]};const nextPlan=plan.filter(item=>item!==dinner||dinner.planDates.length);nextPlan.push(adjusted);FOOD_APP.set('plan',nextPlan)}pending=null;confirmModal.classList.remove('open');adjustResult.className='adjust-result';tempFood.value='';render();FOOD_APP.toast('已按你的同意完成所选日期微调')};
window.addEventListener('food:plan-updated',render);
</script></body></html>
